    <!-- Lista do que a página pode carregar/executar. Script só do
         próprio jogo e do Firebase — sem 'unsafe-inline', então código
         injetado (onerror=, <script>) não roda mesmo que chegue na tela.
         Ao usar um serviço externo novo, inclua o endereço dele aqui. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://www.gstatic.com https://*.firebaseio.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        media-src 'self' blob:;
        connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com;
        frame-src https://*.firebaseio.com https://*.firebaseapp.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self'">
